[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preturi-achizitii-local"
version = "0.1.0"
description = "Comparații explicabile din probe locale de prețuri"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "defusedxml"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
